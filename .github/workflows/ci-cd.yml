name: BookFlow CI/CD

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bookflow-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bookflow_test
          POSTGRES_USER: bookflow
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookflow -d bookflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/bookflow_test
      TEST_DATABASE_USERNAME: bookflow
      TEST_DATABASE_PASSWORD: test-only-password
      TEST_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Test and package executable JAR
        run: mvn --batch-mode --no-transfer-progress clean verify -DfailIfNoTests=true
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7
      - name: Save backend build
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: backend/target/bookflow-backend-*.jar
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'http://localhost:8080' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check production API URL
        if: github.ref == 'refs/heads/main' && vars.AZURE_DEPLOY_ENABLED == 'true'
        run: |
          node --input-type=module -e '
            const value = process.env.VITE_API_BASE_URL;
            const url = new URL(value);
            if (url.protocol !== "https:" || url.pathname !== "/" || value.endsWith("/")) {
              throw new Error("VITE_API_BASE_URL must be an HTTPS origin without a trailing slash");
            }
          '
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  deploy-backend:
    name: Deploy Azure App Service
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: backend-jar
          path: backend-package
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: backend-package/*.jar
      - name: Verify deployed API and database
        env:
          API_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          curl --fail --silent --show-error --retry 18 --retry-all-errors \
            --retry-delay 10 --max-time 20 "${API_URL}/api/books"

  deploy-frontend:
    name: Deploy Azure Static Web Apps
    needs: [backend, frontend, deploy-backend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/dist
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          production_branch: main
