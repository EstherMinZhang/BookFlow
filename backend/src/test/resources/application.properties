spring.datasource.url=${TEST_DATABASE_URL:jdbc:h2:mem:bookflow_test;MODE=PostgreSQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${TEST_DATABASE_USERNAME:sa}
spring.datasource.password=${TEST_DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=${TEST_HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.open-in-view=false
app.cors.allowed-origins=https://bookflow.example
