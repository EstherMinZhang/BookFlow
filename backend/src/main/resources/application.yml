spring:
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:bookflow;MODE=PostgreSQL;DATABASE_TO_UPPER=false}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
        format_sql: true

server:
  port: ${PORT:8080}
